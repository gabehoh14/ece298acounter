# Tiny Tapeout project information
project:
  title:        "8-bit Programmable Binary Counter"
  author:       "Gabriel"
  discord:      ""
  description:  "8-bit binary counter with async reset, sync load, and tri-state outputs"
  language:     "Verilog"
  clock_hz:     100000000

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  source_files:
    - "project.v"
    - "8bitcounter.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs (Parallel Load Data)
  ui[0]: "d_in[0]"
  ui[1]: "d_in[1]"
  ui[2]: "d_in[2]"
  ui[3]: "d_in[3]"
  ui[4]: "d_in[4]"
  ui[5]: "d_in[5]"
  ui[6]: "d_in[6]"
  ui[7]: "d_in[7]"

  # Outputs (Counter Output Bus)
  uo[0]: "count_out[0]"
  uo[1]: "count_out[1]"
  uo[2]: "count_out[2]"
  uo[3]: "count_out[3]"
  uo[4]: "count_out[4]"
  uo[5]: "count_out[5]"
  uo[6]: "count_out[6]"
  uo[7]: "count_out[7]"

  # Bidirectional pins (Control Signals)
  uio[0]: "load"
  uio[1]: "oe"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6